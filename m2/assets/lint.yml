# Reference solution for Module 2 Lab A.
# Path: .github/workflows/lint.yml

name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # quoted — see Trap 3 in yaml_traps.md

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 etl/ --max-line-length=100
